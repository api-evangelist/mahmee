aid: mahmee
name: Mahmee
description: >-
  Mahmee is a wraparound maternal and infant healthcare platform that connects
  expectant and new parents with integrated, coordinated teams of nurses, doulas,
  lactation consultants (IBCLCs), mental health coaches, and nutritionists through
  virtual and in-person appointments. Founded by Melissa Hanna (CEO) and Linda
  Hanna (Director of Care), the platform delivers evidence-based pregnancy and
  postpartum care — including remote blood pressure monitoring, in-home newborn
  jaundice phototherapy, and lactation support — across all 50 U.S. states, with
  in-person clinics in California. Mahmee works with major insurers such as Aetna,
  Cigna, Kaiser Permanente, and United Healthcare, and focuses on reducing maternal
  health disparities. It was surfaced as a portfolio company of 500 Global and
  added to the API Evangelist network for enrichment.
